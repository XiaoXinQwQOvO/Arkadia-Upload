name: Build Assets.car

on:
  workflow_dispatch:
    inputs:
      assets_car_url:
        description: 'Existing Assets.car download URL (skip actool, use directly)'
        required: false

jobs:
  build:
    name: Build Assets.car
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use existing Assets.car
        if: ${{ github.event.inputs.assets_car_url != '' }}
        run: |
          mkdir -p output
          curl -L -o output/Assets.car "${{ github.event.inputs.assets_car_url }}"
          ls -lh output/Assets.car
          echo "Bytes: $(wc -c < output/Assets.car)"
          [ "$(wc -c < output/Assets.car)" -gt 1000 ] || { echo "Downloaded file too small"; exit 1; }
          xcrun --sdk iphoneos assetutil --info output/Assets.car 2>/dev/null | head -20 || true

      - name: Create Asset Catalog
        if: ${{ github.event.inputs.assets_car_url == '' }}
        run: python3 gen_assets.py Assets.xcassets

      - name: Compile with actool
        if: ${{ github.event.inputs.assets_car_url == '' }}
        run: |
          mkdir -p output
          echo "xcode: $(xcodebuild -version 2>/dev/null)"

          echo "=== actool with --output-partial-info-plist ==="
          xcrun actool Assets.xcassets \
            --compile output \
            --platform iphoneos \
            --minimum-deployment-target 13.0 \
            --app-icon AppIcon \
            --output-partial-info-plist output/partial-info.plist \
            --target-device iphone \
            --target-device ipad \
            --warnings --errors 2>&1 || true

          echo "--- output dir contents ---"
          find output -type f -ls 2>/dev/null || true

          if [ ! -f output/Assets.car ] || [ "$(wc -c < output/Assets.car 2>/dev/null)" -lt 100 ]; then
            echo "=== Fallback: no --target-device ==="
            rm -rf output && mkdir -p output
            xcrun actool Assets.xcassets \
              --compile output \
              --platform iphoneos \
              --minimum-deployment-target 13.0 \
              --app-icon AppIcon \
              --output-partial-info-plist output/partial-info.plist 2>&1 || true
            find output -type f -ls 2>/dev/null || true
          fi

          [ -f output/Assets.car ] && [ "$(wc -c < output/Assets.car)" -gt 100 ] || { echo "FAILED: no Assets.car produced"; exit 1; }
          echo "SUCCESS: $(wc -c < output/Assets.car) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: Assets-car
          path: output/Assets.car
          retention-days: 30
