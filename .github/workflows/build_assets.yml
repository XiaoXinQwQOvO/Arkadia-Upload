name: Build Assets.car

on:
  workflow_dispatch:
    inputs:
      assets_car_url:
        description: 'Original Assets.car download URL (optional, for reference)'
        required: false

jobs:
  build:
    name: Build Assets.car
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original Assets.car
        if: ${{ github.event.inputs.assets_car_url != '' }}
        run: |
          curl -L -o original.car "${{ github.event.inputs.assets_car_url }}"
          ls -lh original.car
          xcrun --sdk iphoneos assetutil --info original.car 2>/dev/null | head -30 || true

      - name: Create Asset Catalog
        run: python3 gen_assets.py Assets.xcassets

      - name: Compile with actool
        run: |
          mkdir -p output
          ACTOOL=$(xcrun --find actool 2>/dev/null)
          echo "actool: $ACTOOL"
          echo "xcode: $(xcodebuild -version 2>/dev/null)"
          CMDS=(
            "xcrun actool --platform iphoneos --minimum-deployment-target 13.0 --compile --app-icon AppIcon output Assets.xcassets"
            "xcrun actool --platform iphoneos --minimum-deployment-target 13.0 --compile output Assets.xcassets"
            "xcrun actool --platform iphoneos --minimum-deployment-target 13.0 --compile Assets.xcassets output"
            "$ACTOOL --platform iphoneos --minimum-deployment-target 13.0 --compile --app-icon AppIcon output Assets.xcassets"
            "$ACTOOL --platform iphoneos --minimum-deployment-target 13.0 --compile output Assets.xcassets"
          )
          for cmd in "${CMDS[@]}"; do
            echo "=== $cmd ==="
            eval "$cmd" 2>&1
            FOUND=$(find output /var/folders -name "Assets.car" -newer Assets.xcassets 2>/dev/null | head -1)
            if [ -n "$FOUND" ] && [ "$(wc -c < "$FOUND")" -gt 100 ]; then
              cp "$FOUND" output/Assets.car
              echo "SUCCESS: $(wc -c < output/Assets.car) bytes"
              xcrun --sdk iphoneos assetutil --info output/Assets.car 2>/dev/null | head -20 || true
              break
            fi
          done
          [ -f output/Assets.car ] || { echo "FAILED"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Assets-car
          path: output/Assets.car
          retention-days: 30
