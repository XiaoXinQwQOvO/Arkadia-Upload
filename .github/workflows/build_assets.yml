name: Build Assets.car

on:
  workflow_dispatch:
    inputs:
      assets_car_url:
        description: 'Original Assets.car URL (extracted from IPA). Will be decompiled, AppIcon added, recompiled.'
        required: true

jobs:
  build:
    name: Build Assets.car
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original Assets.car
        run: |
          curl -L -o Assets.car "${{ github.event.inputs.assets_car_url }}"
          ls -lh Assets.car
          echo "Bytes: $(wc -c < Assets.car)"
          [ "$(wc -c < Assets.car)" -gt 1000 ] || { echo "Downloaded file too small"; exit 1; }
          xcrun --sdk iphoneos assetutil --info Assets.car 2>/dev/null | head -20 || true

      - name: Build cartool (Assets.car decompiler)
        run: |
          git -c credential.helper= clone --depth 1 https://github.com/insidegui/cartool.git /tmp/cartool
          cd /tmp/cartool
          xcodebuild -project cartool.xcodeproj -scheme cartool -configuration Release build SYMROOT="$(pwd)/build" CODE_SIGNING_ALLOWED=NO
          sudo cp build/Release/cartool /usr/local/bin/cartool
          cartool 2>&1 | head -5 || true

      - name: Decompile Assets.car -> Assets.xcassets
        run: |
          rm -rf Assets.xcassets
          mkdir -p Assets.xcassets
          cartool Assets.car Assets.xcassets
          echo "=== decompiled tree (top) ==="
          find Assets.xcassets -maxdepth 2 -type d | head -40
          echo "=== imagesets count ==="
          find Assets.xcassets -name "*.imageset" -type d | wc -l
          echo "=== has AppIcon? ==="
          ls -d Assets.xcassets/AppIcon.appiconset 2>/dev/null || echo "NO AppIcon"

      - name: Add/replace AppIcon in Asset Catalog
        run: python3 gen_assets.py Assets.xcassets

      - name: Compile with actool
        run: |
          rm -rf output && mkdir -p output
          echo "xcode: $(xcodebuild -version 2>/dev/null)"

          echo "=== actool attempt 1: target-device iphone+ipad ==="
          xcrun actool Assets.xcassets \
            --compile output \
            --platform iphoneos \
            --minimum-deployment-target 13.0 \
            --app-icon AppIcon \
            --output-partial-info-plist output/partial-info.plist \
            --target-device iphone \
            --target-device ipad \
            --warnings --errors 2>&1 || true

          find output -type f -ls 2>/dev/null || true

          if [ ! -f output/Assets.car ] || [ "$(wc -c < output/Assets.car 2>/dev/null)" -lt 100 ]; then
            echo "=== Fallback: no --target-device ==="
            rm -rf output && mkdir -p output
            xcrun actool Assets.xcassets \
              --compile output \
              --platform iphoneos \
              --minimum-deployment-target 13.0 \
              --app-icon AppIcon \
              --output-partial-info-plist output/partial-info.plist 2>&1 || true
            find output -type f -ls 2>/dev/null || true
          fi

          [ -f output/Assets.car ] && [ "$(wc -c < output/Assets.car)" -gt 100 ] || { echo "FAILED: no Assets.car produced"; exit 1; }
          echo "SUCCESS: $(wc -c < output/Assets.car) bytes"

      - name: Verify diff from original
        run: |
          echo "original: $(wc -c < Assets.car) bytes"
          echo "new:      $(wc -c < output/Assets.car) bytes"
          if cmp -s Assets.car output/Assets.car; then
            echo "WARNING: output identical to original"
          else
            echo "OK: output differs from original (resources preserved + AppIcon added)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Assets-car
          path: output/Assets.car
          retention-days: 1
          overwrite: true
